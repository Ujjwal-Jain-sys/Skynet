# owner: devops
# phase: deploy
# status: review
# updated: 2026-11-12T22:30:00Z
#
# CI/CD pipeline for skynet-photography-portfolio (Next.js App Router on Vercel)
# Stages: lint -> typecheck -> unit tests -> security scan -> build -> deploy
# No secrets in pipeline; app secrets set in the Vercel dashboard.

name: CI/CD — skynet-photography-portfolio

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_ENV: production
  APP_DIR: docs/projects/skynet-photography-portfolio-20261112/code

jobs:
  lint:
    name: Lint (next lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci
      - name: Lint
        working-directory: ${{ env.APP_DIR }}
        run: npm run lint

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci
      - name: Typecheck
        working-directory: ${{ env.APP_DIR }}
        run: npm run typecheck

  unit-test:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci
      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: npx vitest run

  security-scan:
    name: Dependency vulnerability scan (npm audit)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci
      - name: Audit dependencies (fail on HIGH/CRITICAL with fix)
        working-directory: ${{ env.APP_DIR }}
        run: npm audit --audit-level=high

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test, security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run build
      - name: Persist build output
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: ${{ env.APP_DIR }}/.next
          retention-days: 7

  deploy-preview:
    name: Deploy preview (Vercel)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy preview
        working-directory: ${{ env.APP_DIR }}
        run: vercel deploy --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-production:
    name: Deploy production (Vercel)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Deploy to production
        working-directory: ${{ env.APP_DIR }}
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
